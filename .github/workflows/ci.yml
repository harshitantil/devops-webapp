name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Checking project files..."
          ls -la
          test -f index.html
          echo "index.html found successfully."

      - name: Build project
        run: |
          echo "Building DevOps WebApp..."
          mkdir -p build
          cp index.html build/
          echo "Build completed successfully."

      - name: Run tests
        run: |
          echo "Running tests..."
          test -f build/index.html
          echo "All tests passed."

      - name: Generate output logs
        run: |
          echo "CI Pipeline completed successfully."
          echo "Build and test stages completed."
